plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.radar'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // JavaFX for 3D visualization
    implementation 'org.openjfx:javafx-controls:21.0.1'
    implementation 'org.openjfx:javafx-fxml:21.0.1'
    implementation 'org.openjfx:javafx-graphics:21.0.1'
    implementation 'org.openjfx:javafx-base:21.0.1'
    
    // JOML for 3D math
    implementation 'org.joml:joml:1.10.5'
    
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.slf4j:slf4j-simple:2.0.9'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
}

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

application {
    mainClass = 'com.radar.simulator.RadarSimulatorApp'
}

javafx {
    version = '21.0.1'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.graphics']
}

tasks.register('runCli', JavaExec) {
    group = 'application'
    description = 'Runs the command-line simulation pipeline without the GUI.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.radar.simulator.CLISimulatorApp'
}

tasks.named('jar') {
    manifest {
        attributes(
            'Main-Class': 'com.radar.simulator.RadarSimulatorApp'
        )
    }
}
